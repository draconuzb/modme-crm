name: Deploy to Production

on:
  push:
    branches: [main]

env:
  DEPLOY_PATH: /home/ubuntu/modme-crm

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -e

            echo "══════ Deploying Modme CRM ══════"

            # Navigate to project directory
            cd ${{ env.DEPLOY_PATH }}

            # Pull latest code
            echo "→ Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Create .env if it doesn't exist
            if [ ! -f .env ]; then
              echo "⚠ No .env file found! Copy from .env.example and configure."
              exit 1
            fi

            # Build and deploy with Docker Compose
            echo "→ Building containers..."
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "→ Starting services..."
            docker compose -f docker-compose.prod.yml up -d

            # Wait for API to be healthy
            echo "→ Waiting for API health check..."
            sleep 10

            # Run database seed if first deploy
            if [ "${{ github.event.head_commit.message }}" = *"initial"* ]; then
              echo "→ Running database seed..."
              docker compose -f docker-compose.prod.yml exec -T api sh -c "cd apps/api && npx prisma db seed"
            fi

            # Clean up old images
            echo "→ Cleaning up..."
            docker image prune -f

            echo "══════ Deploy complete! ══════"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check passed (HTTP $HTTP_CODE)"
            else
              echo "✗ Health check failed (HTTP $HTTP_CODE)"
              docker compose -f /home/ubuntu/modme-crm/docker-compose.prod.yml logs --tail=50
              exit 1
            fi

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment failed! Check the logs above."
